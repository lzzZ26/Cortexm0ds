<text x="588" y="394" font-family="sans-serif" font-size="16" fill="#222">SRAM 16 拍 INCR 往返</text>
<text x="588" y="424" font-family="sans-serif" font-size="16" fill="#222">82 系数配置 + 1024 样本滤波</text>
<text x="588" y="454" font-family="sans-serif" font-size="16" fill="#222">对称 + 非对称两轮黄金比对 &lt;0.1%</text>
<text x="588" y="484" font-family="sans-serif" font-size="16" fill="#222">DMA 单拍搬运；协议零违规</text>
<text x="588" y="514" font-family="sans-serif" font-size="17" font-weight="bold" fill="#2e8b57">状态</text>
<text x="588" y="546" font-family="sans-serif" font-size="16" fill="#222">PASS</text>
