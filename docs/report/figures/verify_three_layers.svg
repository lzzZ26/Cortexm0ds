<text x="1108" y="302" font-family="sans-serif" font-size="16" fill="#222">tb_soc / tb_soc_asym / tb_soc_smoke</text>
<text x="1108" y="332" font-family="sans-serif" font-size="16" fill="#222">tb_soc_smoke_rom（FPGA ROM 路径）</text>
<text x="1108" y="362" font-family="sans-serif" font-size="17" font-weight="bold" fill="#c47b1a">关键结果</text>
<text x="1108" y="394" font-family="sans-serif" font-size="16" fill="#222">UART 回显 64 字符</text>
<text x="1108" y="424" font-family="sans-serif" font-size="16" fill="#222">6 通道 DMA 自检；软硬协同</text>
<text x="1108" y="454" font-family="sans-serif" font-size="16" fill="#222">CPU 配系数 + DMA 搬运 + 读回比对</text>
<text x="1108" y="484" font-family="sans-serif" font-size="16" fill="#222">1024 样本黄金 &lt;0.1%；四标记齐全</text>
<text x="1108" y="514" font-family="sans-serif" font-size="17" font-weight="bold" fill="#c47b1a">状态</text>
<text x="1108" y="546" font-family="sans-serif" font-size="16" fill="#222">PASS</text>
