<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<rect width="1600" height="900" fill="#ffffff"/>
<text x="800" y="58" font-family="sans-serif" font-size="30" font-weight="bold" text-anchor="middle" fill="#111">三层验证总览：17 个回归目标全部 PASS</text>
<text x="800" y="92" font-family="sans-serif" font-size="17" text-anchor="middle" fill="#555">单元/模块 → 集成（不含 CPU）→ 系统（含 CPU）；协议检查器零违规；误差按相对均方根 &lt;0.1%（逐样本 0.0977% 点态上界）</text>
