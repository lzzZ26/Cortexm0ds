<text x="68" y="270" font-family="sans-serif" font-size="17" font-weight="bold" fill="#2f6fb3">代表 TB</text>
<text x="68" y="302" font-family="sans-serif" font-size="16" fill="#222">tb_fir_core_para / tb_fir_core_sym</text>
<text x="68" y="332" font-family="sans-serif" font-size="16" fill="#222">tb_fir_core / tb_fir_top / tb_fir_top_dual</text>
<text x="68" y="362" font-family="sans-serif" font-size="16" fill="#222">tb_dma_channel / tb_axi_rom / tb_decode</text>
<text x="68" y="392" font-family="sans-serif" font-size="17" font-weight="bold" fill="#2f6fb3">关键结果</text>
<text x="68" y="424" font-family="sans-serif" font-size="16" fill="#222">三套系数黄金回归 &lt;0.1%（对称/非对称/大系数）</text>
<text x="68" y="454" font-family="sans-serif" font-size="16" fill="#222">吞吐 1.0 样本/拍；随机反压；中止 CLR 无污染</text>
<text x="68" y="484" font-family="sans-serif" font-size="16" fill="#222">协议检查器零违规</text>
<text x="68" y="514" font-family="sans-serif" font-size="17" font-weight="bold" fill="#2f6fb3">状态</text>
<text x="68" y="546" font-family="sans-serif" font-size="16" fill="#222">PASS</text>
