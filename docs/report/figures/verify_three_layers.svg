<rect x="560" y="214" width="480" height="12" fill="#2e8b57"/>
<text x="800.0" y="207" font-family="sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#ffffff">② 集成验证（不含 CPU）</text>
<text x="588" y="270" font-family="sans-serif" font-size="17" font-weight="bold" fill="#2e8b57">代表 TB</text>
<text x="588" y="302" font-family="sans-serif" font-size="16" fill="#222">tb_integ / tb_arb / tb_dma_top / tb_dma_chain</text>
<text x="588" y="332" font-family="sans-serif" font-size="16" fill="#222">VIP 替代 CPU，真实互连拓扑</text>
